name: Guard test

# Throwaway (CTActions#123): never merge. A label on a pull request runs ci.yml and
# breakage-suite.yml of the branch test/guard-pin of CTActions, with one job each.

on:
  pull_request:
    types: [opened, reopened, labeled]

jobs:
  ci:
    if: >
      github.event.action != 'labeled' || github.event.label.name == 'question'
    uses: control-toolbox/CTActions/.github/workflows/ci.yml@test/guard-pin
    with:
      versions: '["1"]'
      runs_on: '["ubuntu-latest"]'
      runner_type: 'github'
      use_ct_registry: true
      test_args: 'suite/unicode'
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}

  breakage:
    if: >
      github.event.action != 'labeled' || github.event.label.name == 'question'
    uses: control-toolbox/CTActions/.github/workflows/breakage-suite.yml@test/guard-pin
    with:
      consumers: false
      targets: '[{"name":"CTParser"}]'
      versions: '["stable"]'
      use_ct_registry: true
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
