name: Albert Hello

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Albert model alias or model identifier"
        required: true
        type: string
        default: deepseek
      prompt:
        description: "Prompt sent to the Albert agent"
        required: true
        type: string
        default: "Présente brièvement le projet CTBase."

jobs:
  call:
    uses: control-toolbox/CTActions/.github/workflows/albert-hello.yml@feat/albert-hello-workflow
    with:
      handbook_ref: feat/albert-hello
      agent_path: agents-ai/albert-hello.md
      model: ${{ inputs.model }}
      prompt: ${{ inputs.prompt }}
    secrets:
      ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
      HANDBOOK_READ_TOKEN: ${{ secrets.HANDBOOK_READ_TOKEN }}
