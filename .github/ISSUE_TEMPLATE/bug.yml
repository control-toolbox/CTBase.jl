name: Bug report
description: Report something that does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of CTBase is concerned?
      options:
        - Core
        - Data
        - Descriptions
        - DevTools
        - Differentiation
        - Exceptions
        - Interpolation
        - Options
        - Orchestration
        - Plotting
        - Strategies
        - Traits
        - Unicode
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      render: julia
      placeholder: |
        julia> f(x) = 1
        f (generic function with 1 method)

        julia> f()
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output / stacktrace
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `versioninfo()` and `Pkg.status()`.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
